AWSTemplateFormatVersion: "2010-09-09"
Description: Spry agenda parser Lambda and monthly cost budget

Parameters:
  ProjectName:
    Type: String
    Default: spry
  BackendImageUri:
    Type: String
    Default: 664874246122.dkr.ecr.eu-north-1.amazonaws.com/spry-backend:latest
    Description: Existing backend container image in the deployment region
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
  BedrockRegion:
    Type: String
    Default: us-east-1
  CognitoRegion:
    Type: String
    Default: eu-north-1
  CognitoUserPoolId:
    Type: String
    Default: eu-north-1_m4dJRmho3
  CognitoClientId:
    Type: String
    Default: 1uucla7u51q5an1th1j48hjtbi
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://d3b5dueyhkda58.cloudfront.net,http://localhost:5173
  BudgetEmail:
    Type: String
    Description: Email address to receive the $5 monthly budget alert

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeBedrockMantle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 30
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParserLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      PackageType: Image
      Code:
        ImageUri: !Ref BackendImageUri
      ImageConfig:
        Command: [app.ai.agenda_lambda.handler]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Architectures: [x86_64]
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref BedrockRegion
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          PARSER_CORS_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600

  AgendaParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  MonthlyAiBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly-ai-5-usd"
        BudgetLimit:
          Amount: 5
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  AgendaParserUrl:
    Description: Set as VITE_AGENDA_PARSER_URL in the frontend build
    Value: !GetAtt AgendaParserUrl.FunctionUrl
  AgendaParserFunctionName:
    Value: !Ref AgendaParserFunction
