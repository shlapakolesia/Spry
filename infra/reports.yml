AWSTemplateFormatVersion: "2010-09-09"
Description: Spry weekly reports event-driven infrastructure

Parameters:
  ProjectName:
    Type: String
    Default: spry
  ReportEmail:
    Type: String
    Description: Verified SES email used as sender and recipient
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL for report builder
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-01da44e0522af7fb3

  RouteTableId:
    Type: String
    Default: rtb-0daf2fcbdbee9682e

Resources:

  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - ReportMailerInvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            ExpirationInDays: 90

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"

      RouteTableIds:
        - !Ref RouteTableId

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"

      VisibilityTimeout: 540

      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-builder-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole

      Policies:
        - PolicyName: WriteReportsToS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${ReportsBucket.Arn}/reports/*"

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"

      PackageType: Image

      Code:
        ImageUri: 664874246122.dkr.ecr.eu-north-1.amazonaws.com/spry-backend:latest

      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler

      Role: !GetAtt ReportBuilderRole.Arn

      Timeout: 90
      MemorySize: 512

      Architectures:
        - x86_64

      VpcConfig:
        SecurityGroupIds:
          - sg-024614036ebadfa3e

        SubnetIds:
          - subnet-09c54c7d8c19b8d3a
          - subnet-06cb98888ce17a7c3
          - subnet-043ecedf75a5dcdee

      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          REPORTS_BUCKET: !Ref ReportsBucket

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportRequestsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref ReportBuilderFunction
      BatchSize: 1
      Enabled: true


  ReportSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-scheduler-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: SendReportRequest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"

      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: Europe/Kyiv

      FlexibleTimeWindow:
        Mode: "OFF"

      State: ENABLED

      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt ReportSchedulerRole.Arn
        Input: '{"week":null,"source":"schedule"}'
  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-mailer-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReadReportsAndSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"

              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                Resource: "*"

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"

      PackageType: Image

      Code:
        ImageUri: 664874246122.dkr.ecr.eu-north-1.amazonaws.com/spry-backend:latest

      ImageConfig:
        Command:
          - app.reports.mailer_handler.handler

      Role: !GetAtt ReportMailerRole.Arn

      Timeout: 30
      MemorySize: 256

      Architectures:
        - x86_64

      Environment:
        Variables:
          REPORT_EMAIL: !Ref ReportEmail

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  ReportMailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportMailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}"
Outputs:

  ReportsBucketName:
    Description: S3 bucket for weekly reports
    Value: !Ref ReportsBucket

  ReportRequestsQueueUrl:
    Description: URL of the report request queue
    Value: !Ref ReportRequestsQueue

  ReportRequestsQueueArn:
    Description: ARN of the report request queue
    Value: !GetAtt ReportRequestsQueue.Arn

  ReportRequestsDLQUrl:
    Description: URL of the report request dead-letter queue
    Value: !Ref ReportRequestsDLQ
